name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap Cloudflare resources (idempotent — reuses existing)
        run: npm run bootstrap
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify ENCRYPTION_KEY is set
        run: |
          if [ -z "${{ secrets.ENCRYPTION_KEY }}" ]; then
            echo "::error::ENCRYPTION_KEY is required (generate with: openssl rand -base64 32). Add it as a repository Actions secret."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # ENCRYPTION_KEY must exist as a GitHub Actions secret (base64, 32 bytes).
          secrets: |
            ENCRYPTION_KEY
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}